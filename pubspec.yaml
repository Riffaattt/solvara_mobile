name: hackathon_salvara
description: "Solvara — AI-assisted civic issue reporting app for citizens."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # HTTP
  dio: ^5.8.0+1

  # Navigation
  go_router: ^15.1.2

  # Secure token storage
  flutter_secure_storage: ^9.2.4

  # Image selection
  image_picker: ^1.1.2

  # Location
  geolocator: ^14.0.1

  # Equatable for value objects
  equatable: ^2.0.5

  # MIME type parsing for multipart upload
  http_parser: ^4.0.2

  # JSON serialization runtime
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Code generation
  build_runner: ^2.4.15
  riverpod_generator: ^2.6.5
  json_serializable: ^6.9.5

flutter:
  uses-material-design: true
